[project]
name = "docker-images-saver"
version = "0.1.0"
description = "Save docker images used in a docker compose"
readme = "README.md"
authors = [
    { name = "dinhanhx", email = "dinhanhx@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
docker-images-saver = "docker_images_saver.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
